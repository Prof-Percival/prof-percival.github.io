      <rect x="90" y="-87" width="96" height="42" rx="10"/>
      <rect x="90" y="45" width="96" height="42" rx="10"/>
      <rect x="-48" y="113" width="96" height="42" rx="10"/>
      <rect x="-186" y="45" width="96" height="42" rx="10"/>
