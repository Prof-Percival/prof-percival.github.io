<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Phadima Percival Maredi, Software Engineer</title>
  <desc id="desc">A dark portfolio card with a PM systems map and the statement I build dependable software systems.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#27313d" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#70e1bd" stop-opacity=".18"/>
      <stop offset="1" stop-color="#70e1bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#70e1bd"/>
      <stop offset="1" stop-color="#eaa45f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#090d12"/>
  <circle cx="1040" cy="30" r="320" fill="#eaa45f" opacity=".04"/>
  <circle cx="70" cy="90" r="260" fill="#70e1bd" opacity=".06"/>
  <rect x="54" y="54" width="1092" height="522" rx="28" fill="none" stroke="#27313d"/>
  <g transform="translate(84 84)">
    <rect width="58" height="58" rx="15" fill="#101720" stroke="#3b4856"/>
    <text x="29" y="35" fill="#70e1bd" font-family="ui-monospace,monospace" font-size="16" font-weight="700" text-anchor="middle">PM</text>
    <text x="78" y="24" fill="#ffffff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Phadima Percival Maredi</text>
    <text x="78" y="49" fill="#9ba6b3" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2">SOFTWARE ENGINEER</text>
  </g>
  <text x="84" y="267" fill="#f1efe9" font-family="Georgia,serif" font-size="76" letter-spacing="-3">I build dependable</text>
  <text x="84" y="349" fill="#f1efe9" font-family="Georgia,serif" font-size="76" letter-spacing="-3">software systems</text>
  <text x="84" y="431" fill="#f1efe9" font-family="Georgia,serif" font-size="76" letter-spacing="-3">that matter.</text>
  <text x="88" y="513" fill="#9ba6b3" font-family="Arial,sans-serif" font-size="20">Full-stack products · Cloud infrastructure · Data systems</text>
  <g transform="translate(895 315)">
