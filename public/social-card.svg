    <path d="M0-130 113-65 113 65 0 130-113 65-113-65Z" fill="none" stroke="url(#line)" stroke-width="3" stroke-dasharray="18 15"/>
    <path d="M0 0V-130M0 0 113-65M0 0 113 65M0 0V130M0 0-113 65M0 0-113-65" stroke="#3b4856" stroke-dasharray="3 8"/>
